
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | AI Career Guidance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <div id="navbar-container"></div>

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 700px;">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Edit My Profile</h2>

                <form id="editProfileForm">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="editName" class="form-control" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="editEmail" class="form-control" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <input type="text" id="editCourse" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Year</label>
                        <input type="text" id="editYear" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Percentage</label>
                        <input type="number" id="editPercentage"
                               class="form-control" min="0" max="100"
                               step="0.01" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Stream</label>
                        <input type="text" id="editStream" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Skills</label>
                        <textarea id="editSkills" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Interests</label>
                        <textarea id="editInterest" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">
                            Save Changes
                        </button>

                        <a href="profile.html" class="btn btn-secondary w-100">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
    <script src="edit-profile.js"></script>

</body>
</html>
