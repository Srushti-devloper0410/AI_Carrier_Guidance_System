
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | AI Career Guidance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css">

    <style>
        body {
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .edit-profile-container {
            max-width: 750px;
            margin: 45px auto;
            padding: 0 15px;
        }

        .edit-profile-card {
            background: #fff;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(30, 64, 175, 0.10);
            overflow: hidden;
        }

        .edit-profile-header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        .edit-profile-header h2 {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .edit-profile-header p {
            margin: 0;
            opacity: 0.9;
        }

        .edit-profile-body {
            padding: 35px;
        }

        .form-label {
            color: #26334d;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            border: 1px solid #d7dfed;
            border-radius: 9px;
            padding: 11px 13px;
            font-size: 15px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-control[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
        }

        .edit-profile-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .edit-profile-actions .btn {
            border-radius: 9px;
            padding: 11px;
            font-weight: 600;
        }

        .edit-profile-actions .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
        }

        .edit-profile-actions .btn-primary:hover {
            background: #1d4ed8;
        }

        @media (max-width: 576px) {
            .edit-profile-container {
                margin: 25px auto;
            }

            .edit-profile-body {
                padding: 22px;
            }

            .edit-profile-header h2 {
                font-size: 23px;
            }

            .edit-profile-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Edit Profile Section -->
    <div class="edit-profile-container">

        <div class="card edit-profile-card">

            <div class="edit-profile-header">
                <h2>Edit My Profile</h2>
                <p>Update your academic information</p>
            </div>

            <div class="edit-profile-body">

                <form id="editProfileForm">

                    <div class="mb-3">
                        <label for="editName" class="form-label">Full Name</label>
                        <input type="text" id="editName" class="form-control" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email Address</label>
                        <input type="email" id="editEmail" class="form-control" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="editCourse" class="form-label">Course</label>
                        <input type="text" id="editCourse" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="editYear" class="form-label">Academic Year</label>
                        <input type="text" id="editYear" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="editPercentage" class="form-label">Percentage</label>
                        <input
                            type="number"
                            id="editPercentage"
                            class="form-control"
                            min="0"
                            max="100"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="editStream" class="form-label">Stream</label>
                        <input type="text" id="editStream" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="editSkills" class="form-label">Skills</label>
                        <textarea
                            id="editSkills"
                            class="form-control"
                            rows="3"
                            required
                        ></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="editInterest" class="form-label">Interests</label>
                        <textarea
                            id="editInterest"
                            class="form-control"
                            rows="3"
                            required
                        ></textarea>
                    </div>

                    <div class="edit-profile-actions">

                        <button type="submit" class="btn btn-primary w-100">
                            Save Changes
                        </button>

                        <a href="profile.html" class="btn btn-secondary w-100">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
    <script src="edit-profile.js"></script>

</body>
</html>
